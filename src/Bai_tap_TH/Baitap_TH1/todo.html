<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
     <style>
        #todoList {
            font-family: Arial, Helvetica, sans-serif;
            border-collapse: collapse;
            width: 100%;
            padding-top: 20px
        }

        #todoList td,
        #todoList th {
            border: 1px solid #ddd;
            padding: 8px;
        }

        #todoList tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        #todoList tr:hover {
            background-color: #ddd;
        }

        #todoList th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #04AA6D;
            color: white;
        }
        #table {
            padding-top: 20px
        }
    </style>
</head>
<body>
    <h1>To do list</h1>
    <a href="video70.html">Create tasks</a>
    <div id="table">
        <table id="todoList">
        <thead>
            <th>Id</th>
            <th>Task</th>
            <th>Action</th>
        </thead>
        <tbody>
            <!-- <tr>
